name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install project
        run: python -m pip install -e .
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Architecture check
        run: lint-imports
      - name: Fast tests and coverage
        run: pytest -m 'not slow' --cov=src/muwajjih/domain --cov=src/muwajjih/service --cov=src/muwajjih/api --cov-report=term-missing --cov-branch

  container-smoke:
    runs-on: ubuntu-latest
    needs: validate
    env:
      MUWAJJIH_IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --platform linux/amd64 -t muwajjih:${{ github.sha }} .
      - name: Image size gate
        run: |
          size=$(docker image inspect muwajjih:${{ github.sha }} --format '{{.Size}}')
          echo "Image bytes: $size"
          test "$size" -le 500000000
      - name: Start stack
        run: docker compose up -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/v1/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Smoke
        run: |
          curl -fsS http://localhost:8000/v1/health
          curl -fsS http://localhost:8000/v1/ready
          curl -fsS -X POST http://localhost:8000/v1/predict \
            -H 'Content-Type: application/json' \
            -d '{"complaint_id":"MWJ-CI-001","text":"هناك حريق قرب مدرسة"}'
      - name: Shutdown
        if: always()
        run: docker compose down -v

  slow-behavioural:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install project
        run: python -m pip install -e .
      - name: Behavioural suite
        run: pytest -m slow -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate, container-smoke, slow-behavioural, secret-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
