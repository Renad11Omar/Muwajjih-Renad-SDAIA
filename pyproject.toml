[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "muwajjih"
version = "1.0.0"
description = "Production-ready AI service for municipal and government complaint triage"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.128.2",
  "joblib==1.5.3",
  "numpy==2.3.5",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "redis==5.2.1",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "import-linter==2.3",
  "mypy==1.18.2",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "unit: pure domain/service tests",
  "integration: API contract tests",
  "behavioural: real-model behaviour tests",
  "slow: loads the real model or golden set",
]

[tool.coverage.run]
branch = true
source = ["src/muwajjih/domain", "src/muwajjih/service", "src/muwajjih/api"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
exclude = "tests|scripts"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.importlinter]
root_package = "muwajjih"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain stays independent"
type = "forbidden"
source_modules = ["muwajjih.domain"]
forbidden_modules = ["muwajjih.api", "muwajjih.adapters", "fastapi", "redis", "sklearn"]

[[tool.importlinter.contracts]]
name = "Service stays framework free"
type = "forbidden"
source_modules = ["muwajjih.service"]
forbidden_modules = ["muwajjih.api", "muwajjih.adapters", "fastapi", "redis", "sklearn"]
